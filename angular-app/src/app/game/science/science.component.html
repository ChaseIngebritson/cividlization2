<div class="science-page bg-dark p-4 overflow-auto">
  <h2>Science</h2>
  <p class="text-muted">Technology tree recovered from production data (original SVG map template also extracted).</p>
  <ul class="tech-list">
    @for (tech of techs; track tech.id) {
      <li>
        <strong>{{ tech.label }}</strong>
        <span class="rank">rank {{ tech.rank }}</span>
        @if (tech.require?.length) {
          <span class="req">requires {{ tech.require.join(', ') }}</span>
        }
      </li>
    }
  </ul>
</div>
