<div class="p-3 h-100 overflow-auto">
  <h3>Notifications</h3>
  @if (notifications.length === 0) {
    <p class="text-muted">No notifications yet.</p>
  } @else {
    <div class="overflow-auto">
      @for (n of notifications; track $index) {
        <div class="mb-2">
          @if (n.icon) {
            <i [class]="n.icon"></i>
          }
          {{ n.text }}
        </div>
      }
    </div>
  }
</div>
