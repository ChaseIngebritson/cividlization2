<div class="h-100 overflow-auto p-3">
  <h5>
    Policy cost:
    <span class="text-culture">
      <i class="fas fa-theater-masks"></i>
      {{ policyCost }}
    </span>
  </h5>

  <div class="d-flex flex-wrap p-relative">
    @for (g of groups; track g.id) {
      <div class="m-2" style="width: 225px">
        <h4>{{ g.name }}</h4>
        <div class="list-group">
          @for (p of policiesFor(g.id); track p.id) {
            <div
              class="list-group-item list-group-item-action py-1"
              [class.text-secondary]="!p.unlocked"
              [class.text-primary]="p.owned"
              [class.text-success]="p.unlocked && !p.owned"
              [title]="p.descriptionPlain"
            >
              {{ p.name }}
            </div>
          }
        </div>
      </div>
    }
  </div>

  <div class="policy-container border m-2 rounded-lg p-2" style="max-width: 1430px">
    <h4 class="px-3 py-2 m-0">
      Mixed policies
      <span class="text-70 text-secondary">(Policies that require 2 groups)</span>
    </h4>
    <div class="d-flex flex-wrap px-2">
      @for (p of mixedPolicies; track p.id) {
        <span
          class="border rounded m-1 px-2 py-1"
          style="width: 236px"
          [class.text-secondary]="!p.unlocked"
          [class.text-primary]="p.owned"
          [title]="p.descriptionPlain"
        >
          {{ p.name }}
        </span>
      }
    </div>
  </div>

  <div class="d-flex flex-wrap align-items-center mt-2">
    <div class="border p-3 text-success">Available for purchase</div>
    <div class="border p-3 text-primary">Purchased</div>
    <div class="border p-3 text-secondary">Unavailable</div>
    <div class="border p-3 text-danger">Locked</div>
  </div>
</div>
