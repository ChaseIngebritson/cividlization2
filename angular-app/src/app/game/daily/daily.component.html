<div class="p-3">
  <h2>Daily Bonus !</h2>

      <div class="card cursor-pointer border-primary m-3 rounded-lg text-primary daily-card">

          <i class="fas fa-gift"></i>
        </div>
      </div>
    }
  </div>
</div>
