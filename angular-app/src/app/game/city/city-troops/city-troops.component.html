<div class="border-left h-100 d-flex flex-column city-troops">
  <div class="h-40 d-flex flex-column p-2">
    <h3>Troops</h3>
    <div class="flex-fill overflow-auto">
      @for (u of unitList; track u.id) {
        <div class="d-flex p-1">
          <div class="flex-fill">{{ u.name }}</div>
        </div>
      }
    </div>
  </div>
</div>
